services:
  sc_php:
    image: special-c/sc_php:main
    # container_name: sc_php
    build:
      context: ./php-world
      dockerfile: docker/Dockerfile
      args:
        APP_ENV: ${APP_ENV}
    env_file:
      - .env
    volumes:
      - ./php-world/app:/app/app:delegated
      - ./php-world/bootstrap:/app/bootstrap:delegated
      - sc_php_bootstrap_cache_volume_php:/app/bootstrap/cache
      - ./php-world/config:/app/config:delegated
      - ./php-world/database:/app/database:delegated
      - ./php-world/public:/app/public:delegated
      - ./php-world/routes:/app/routes:delegated
      - ./php-world/tests:/app/tests:delegated
    depends_on:
      sc_mysql:
        condition: service_healthy
      sc_redis:
        condition: service_healthy

  sc_nginx:
    image: nginx:1.27.3-alpine
    ports:
      - "22080:80"
    volumes:
      - ./php-world/public:/app/public:ro
      - ./php-world/docker/linux/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sc_php

  sc_mysql:
    image: mysql:8.4.4
    restart: unless-stopped
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: php_creativity
      MYSQL_USER: basic
      MYSQL_PASSWORD: basic
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "22160:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 22s
      timeout: 11s
      retries: 7
      start_period: 80s
    volumes:
      - sc_db_mysql_volume:/var/lib/mysql

  sc_redis:
    image: redis:7.4.1-alpine
    ports:
      - "22161:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 22s
      timeout: 11s
      retries: 7
      start_period: 42s
    volumes:
      - sc_cache_redis_volume:/data

  sc_scheduler:
    image: special-c/sc_scheduler:main
    build:
      context: ./php-world
      dockerfile: docker/Dockerfile
      args:
        APP_ENV: ${APP_ENV}
    env_file:
      - .env
    volumes:
      - ./php-world/app:/app/app:delegated
      - ./php-world/bootstrap:/app/bootstrap:delegated
      - sc_php_bootstrap_cache_volume_scheduler:/app/bootstrap/cache
      - ./php-world/config:/app/config:delegated
      - ./php-world/database:/app/database:delegated
      - ./php-world/public:/app/public:delegated
      - ./php-world/routes:/app/routes:delegated
    depends_on:
      sc_php:
        condition: service_started
      sc_mysql:
        condition: service_healthy
      sc_redis:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  sc_kafka_consumer:
    image: special-c/sc_kafka_consumer:main
    build:
      context: ./php-world
      dockerfile: docker/Dockerfile
      args:
        APP_ENV: ${APP_ENV}
    env_file:
      - .env
    volumes:
      - ./php-world/app:/app/app:delegated
      - ./php-world/bootstrap:/app/bootstrap:delegated
      - sc_php_bootstrap_cache_volume_kafka_consumer:/app/bootstrap/cache
      - ./php-world/config:/app/config:delegated
      - ./php-world/database:/app/database:delegated
      - ./php-world/public:/app/public:delegated
      - ./php-world/routes:/app/routes:delegated
    depends_on:
      sc_kafka_broker_a:
        condition: service_healthy
      sc_kafka_broker_b:
        condition: service_healthy
      sc_kafka_broker_c:
        condition: service_healthy
    command: ["php", "artisan", "kafka:consume"]
    restart: unless-stopped

  sc_llm:
    image: special-c/sc_llm:main
    # container_name: sc_llm
    build:
      context: ./llm
      dockerfile: docker/Dockerfile
      args:
        APP_ENV: ${APP_ENV}
        TZ: ${TZ}
    ports:
      - "22111:8000"
    volumes:
      - ./llm/src:/app/src:delegated
      - ./llm/main.py:/app/main.py:delegated
      - ./llm/config.py:/app/config.py:delegated
      - sc_hugging_face:/hugging_face_cache
    depends_on:
      sc_php:
        condition: service_started
      sc_mysql:
        condition: service_healthy
      sc_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "--version"]
      interval: 31s
      timeout: 8s
      retries: 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      HF_HOME: /hugging_face_cache
      HF_TOKEN: ${HF_TOKEN}
      OA_TOKEN: ${OA_TOKEN}

  sc_kafka_ctl_alpha:
    image: special-c/sc_kafka:main
    build:
      context: ./kafka
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTER_ID=${KAFKA_CID}
    volumes:
      - sc_kafka_ctl_volume_a:/var/lib/kafka/data
      - ./kafka/ctl-alpha.props:/etc/kafka/server.properties:ro
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    command: ["/etc/kafka/server.properties"]

  sc_kafka_ctl_betta:
    image: special-c/sc_kafka:main
    build:
      context: ./kafka
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTER_ID=${KAFKA_CID}
    volumes:
      - sc_kafka_ctl_volume_b:/var/lib/kafka/data
      - ./kafka/ctl-betta.props:/etc/kafka/server.properties:ro
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    command: ["/etc/kafka/server.properties"]

  sc_kafka_broker_a:
    image: special-c/sc_kafka:main
    build:
      context: ./kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 22s
      timeout: 13s
      retries: 8
      start_period: 33s
    ports:
      - "29092:29092"
    environment:
      - KAFKA_CLUSTER_ID=${KAFKA_CID}
    volumes:
      - sc_kafka_broker_volume_a:/var/lib/kafka/data
      - ./kafka/broker-a.props:/etc/kafka/server.properties:ro
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    command: ["/etc/kafka/server.properties"]

  sc_kafka_broker_b:
    image: special-c/sc_kafka:main
    build:
      context: ./kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 22s
      timeout: 13s
      retries: 8
      start_period: 33s
    environment:
      - KAFKA_CLUSTER_ID=${KAFKA_CID}
    volumes:
      - sc_kafka_broker_volume_b:/var/lib/kafka/data
      - ./kafka/broker-b.props:/etc/kafka/server.properties:ro
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    command: ["/etc/kafka/server.properties"]

  sc_kafka_broker_c:
    image: special-c/sc_kafka:main
    build:
      context: ./kafka
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 22s
      timeout: 13s
      retries: 8
      start_period: 33s
    environment:
      - KAFKA_CLUSTER_ID=${KAFKA_CID}
    volumes:
      - sc_kafka_broker_volume_c:/var/lib/kafka/data
      - ./kafka/broker-c.props:/etc/kafka/server.properties:ro
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    command: ["/etc/kafka/server.properties"]

  sc_kafka_ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      sc_kafka_broker_a:
        condition: service_healthy
      sc_kafka_broker_b:
        condition: service_healthy
      sc_kafka_broker_c:
        condition: service_healthy
    ports:
      - "22081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=sc_kafka_broker_a:9092,sc_kafka_broker_b:9092,sc_kafka_broker_c:9092

volumes:
  sc_kafka_ctl_volume_a:
    name: sc_dev_kafka_ctl_a
  sc_kafka_ctl_volume_b:
    name: sc_dev_kafka_ctl_b
  sc_kafka_broker_volume_a:
    name: sc_dev_kafka_broker_a
  sc_kafka_broker_volume_b:
    name: sc_dev_kafka_broker_b
  sc_kafka_broker_volume_c:
    name: sc_dev_kafka_broker_c
  sc_db_mysql_volume:
    name: sc_dev_db_mysql
  sc_cache_redis_volume:
    name: sc_dev_cache_redis
  sc_php_bootstrap_cache_volume_php:
    name: sc_dev_bootstrap
  sc_php_bootstrap_cache_volume_scheduler:
    name: sc_dev_bootstrap_scheduler
  sc_php_bootstrap_cache_volume_kafka_consumer:
    name: sc_dev_bootstrap_kafka_consumer
  sc_hugging_face:
    name: cs_hugging_face_cache
